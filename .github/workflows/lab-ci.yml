name: Lab CI científico

on:
  push:
    paths:
      - 'src/strategy_lab/**'
      - 'scripts/lab_ci.py'
      - 'scripts/lab_run.py'
      - 'datasets/**'
  workflow_dispatch:

jobs:
  lab-ci:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyarrow pandas numpy scipy
      - name: Lint + Tests
        run: |
          python -m pytest tests/test_experiment_runner.py tests/test_promotion_gate.py -q
      - name: CI científico
        run: |
          python scripts/lab_ci.py --dataset datasets/dataset_v001/manifest.json \
            --experiment-id EXP-CI-CANARY --seed 42 --report-dir reports
