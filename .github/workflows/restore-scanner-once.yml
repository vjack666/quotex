name: restore scanner after refactor write

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.event.head_commit.message != 'chore: restore scanner from pre-refactor tree' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore scanner from known-good parent
        run: |
          git checkout 837686eaacc1bc5bb19705a2c7bdefe469127b51 -- src/scanner.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scanner.py')
          text = p.read_text(encoding='utf-8')
          old = 'from scan_prefetch import ('
          new = 'from scan_pipeline.prefetch import ('
          if old not in text:
              raise SystemExit('expected legacy prefetch import not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/scanner.py
          git commit -m 'chore: restore scanner from pre-refactor tree'
          git push origin HEAD:main
